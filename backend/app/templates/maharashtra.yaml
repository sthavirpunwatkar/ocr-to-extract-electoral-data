template_name: maharashtra_voter_roll
version: "1.3"
region: Maharashtra

# Anchors help locate the document type and orientation
anchors:
  - "भारत निवडणूक आयोग"
  - "ELECTION COMMISSION OF INDIA"
  - "मतदार यादी"

fields:
  voter_id:
    # EPIC ID: 3 letters + 7 digits, or old formats
    regex: "(?:[A-Z]{3}[0-9]{7})|(?:[A-Z]{1,4}/[0-9]{1,4}/[0-9]{1,4}/[0-9]{1,7})|(?:[A-Z]{2,3}\\s?[0-9]{7,8})"
    required: true
  full_name:
    label: "नाव|नांव|नाद|नवि|नांय|नाब|नांव:|नाव:|नाद:|नाय|नाय:|नादः|नावा|नावे|नांवः|नावा:|नाच|नाम|Name|Nave|Naav|Nav"
    required: true
  father_name:
    label: "वडिलांचे नाव|वडिलांचे|वडीलांचे|Father's Name"
    required: false
  husband_name:
    label: "पतीचे नाव|पतीचे|Husband's Name"
    required: false
  mother_name:
    label: "आईचे नाव|आईचे|Mother's Name"
    required: false
  house_number:
    label: "घराचा क्रमांक|घर क्रमांक|घर क्र|घर क्र.|घर|House Number|House No"
    required: false
  age:
    label: "वय|Age|वय-ः|वय:|वय -:"
    regex: "\\b[0-9]{2,3}\\b"
    required: false
  gender:
    label: "लिंग|Gender"
    options: ["पुरुष", "स्त्री", "पु.", "स्त्र.", "Male", "Female", "M", "F"]
    required: false

# Layout definitions for coordinate-based extraction
layout:
  grid_cols: 3
  grid_rows: 10
  # Expected bounding box for a single voter card (normalized 0.0 to 1.0)
  card_width: 0.33
  card_height: 0.10
