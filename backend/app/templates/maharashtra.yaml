template_name: maharashtra_voter_roll
version: "1.2"
region: Maharashtra

fields:
  voter_id:
    regex: "([A-Z]{2,3}[\\s\\-]?[0-9]{7})|([A-Z]{2}/[0-9]{2}/[0-9]{3}/[0-9]{7})"
    required: true
  full_name:
    label: "नाव|Name"
    required: true
  father_husband_name:
    label: "वडिलांचे नाव|पतीचे नाव|वडिलांचे|पतीचे|Father's Name|Husband's Name"
    required: false
  house_number:
    label: "घराचा क्रमांक|घर क्रमांक|घर क्र|घर क्र.|घर|House Number"
    required: false
  age:
    label: "वय|Age|वय-ः|वय:"
    regex: "\\b[0-9]{2,3}\\b"
    required: false
  gender:
    label: "लिंग|Gender"
    options: ["पुरुष", "स्त्री", "पु.", "स्त्र.", "Male", "Female", "Third Gender"]
    required: false

# Layout definitions for coordinate-based extraction (if needed later)
layout:
  grid_cols: 3
  grid_rows: 10
