template_name: maharashtra_voter_roll
version: "1.1"
region: Maharashtra

fields:
  voter_id:
    regex: "([A-Z]{3}[0-9]{7})|([A-Z]{2}/[0-9]{2}/[0-9]{3}/[0-9]{7})"
    required: true
  full_name:
    label: "नाव|Name"
    required: true
  father_husband_name:
    label: "वडिलांचे नाव|पतीचे नाव|Father's Name|Husband's Name"
    required: false
  house_number:
    label: "घराचा क्रमांक|House Number"
    required: false
  age:
    label: "वय|Age"
    regex: "[0-9]{2,3}"
    required: false
  gender:
    label: "लिंग|Gender"
    options: ["पुरुष", "स्त्री", "Male", "Female", "Third Gender"]
    required: false

# Layout definitions for coordinate-based extraction (if needed later)
layout:
  grid_cols: 3
  grid_rows: 10
